services:
  reservations:
    build:
      context: .
      dockerfile: apps/reservations/Dockerfile
      target: development
    command: pnpm run start:dev reservations
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./apps/reservations/.env
    environment:
      - CI=true
      - MONGODB_URI=mongodb://mongo:27017/sleepr
    depends_on:
      - mongo
      - rabbitmq

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: development
    command: pnpm run start:dev auth
    ports:
      - '3001:3001'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./apps/auth/.env
    environment:
      - CI=true
      - MONGODB_URI=mongodb://mongo:27017/sleepr
    depends_on:
      - mongo
      - rabbitmq

  payments:
    build:
      context: .
      dockerfile: apps/payments/Dockerfile
      target: development
    command: pnpm run start:dev payments
    volumes:
      - .:/usr/src/app 
      - /usr/src/app/node_modules 
    env_file:
      - ./apps/payments/.env  
    environment:
      - CI=true
      - MONGODB_URI=mongodb://mongo:27017/sleepr
    depends_on:
      - mongo   
      - rabbitmq

  notifications:
    build:
      context: .
      dockerfile: apps/notifications/Dockerfile
      target: development
    command: pnpm run start:dev notifications
    volumes:
      - .:/usr/src/app 
      - /usr/src/app/node_modules 
    env_file:
      - ./apps/notifications/.env  
    environment:
      - CI=true
      - MONGODB_URI=mongodb://mongo:27017/sleepr
    depends_on:
      - mongo     
      - rabbitmq

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes: 
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:latest
    ports:
      - '5672:5672' 

volumes:
  mongo-data: