apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - image: 923605793720.dkr.ecr.us-east-1.amazonaws.com/auth:latest
          imagePullPolicy: Always
          name: auth
          env:
            - name: HTTP_PORT
              value: '3001'
            - name: TCP_PORT
              value: '3002'
            - name: JWT_EXPIRATION
              value: '3600'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt
                  key: jwtSecret
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb
                  key: uri
          ports:
            - containerPort: 3001
            - containerPort: 3002