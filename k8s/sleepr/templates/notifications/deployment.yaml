apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: notifications
  name: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
        - image: 923605793720.dkr.ecr.us-east-1.amazonaws.com/notifications:latest
          imagePullPolicy: Always
          name: notifications
          env:
            - name: PORT
              value: '3004'
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: "596585533422-jud3fi61vi0ij73gnkdusbeiv5uj9du5.apps.googleusercontent.com"
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google
                  key: clientSecret
            - name: GOOGLE_OAUTH_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: google
                  key: refreshToken
            - name: SMTP_USER
              value: "akandeakinlolu9@gmail.com"
          ports:
            - containerPort: 3004
