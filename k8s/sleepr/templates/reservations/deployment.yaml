              value: '3003'
            - name: AUTH_HOST
              value: "auth-tcp"
            - name: AUTH_PORT
              value: '3002'
            - name: MONGODB_URI
              value: "mongodb+srv://akandeakinlolu9_db_user:9eaq6NAOEcu4AOB1@sleepr.ayvzqyc.mongodb.net/sleepr?retryWrites=true&w=majority"
          ports:
