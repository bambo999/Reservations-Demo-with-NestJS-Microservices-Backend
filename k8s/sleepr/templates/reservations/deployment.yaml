apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reservations
  name: reservations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservations
  template:
    metadata:
      labels:
        app: reservations
    spec:
      containers:
        - image: 923605793720.dkr.ecr.us-east-1.amazonaws.com/reservations:latest
          imagePullPolicy: Always
          name: reservations
          env:
            - name: PORT
